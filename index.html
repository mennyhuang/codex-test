<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Codex 配置成功测试页面">
  <title>我的第一个 Codex 项目</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f9ff;
      color: #102a56;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(65, 145, 255, 0.18), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(47, 117, 255, 0.13), transparent 30%),
        linear-gradient(145deg, #ffffff 0%, #edf5ff 52%, #f8fbff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(55, 125, 240, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(55, 125, 240, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .orb {
      position: fixed;
      width: 320px;
      aspect-ratio: 1;
      border: 1px solid rgba(49, 127, 255, 0.16);
      border-radius: 50%;
      animation: float 7s ease-in-out infinite;
    }

    .orb::before, .orb::after {
      content: "";
      position: absolute;
      inset: 34px;
      border: inherit;
      border-radius: inherit;
    }

    .orb::after { inset: 76px; }
    .orb-left { top: -135px; left: -105px; }
    .orb-right { right: -110px; bottom: -145px; animation-delay: -3.5s; }

    .card {
      position: relative;
      z-index: 1;
      width: min(90vw, 680px);
      padding: 64px 44px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 70px rgba(37, 101, 190, 0.14);
      backdrop-filter: blur(18px);
    }

    .status-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(135deg, #1976ff, #55a9ff);
      box-shadow: 0 14px 32px rgba(25, 118, 255, 0.28);
      color: #fff;
      font-size: 36px;
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2878e8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #102f62;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 460px;
      margin: 22px auto 36px;
      color: #6680a6;
      font-size: 17px;
      line-height: 1.8;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 170px;
      padding: 16px 28px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(120deg, #0868f5, #3296ff);
      box-shadow: 0 12px 28px rgba(8, 104, 245, 0.28);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .start-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 34px rgba(8, 104, 245, 0.34);
    }

    .start-button:focus-visible {
      outline: 3px solid rgba(8, 104, 245, 0.3);
      outline-offset: 4px;
    }

    .arrow { transition: transform 180ms ease; }
    .start-button:hover .arrow { transform: translateX(4px); }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(18px) rotate(8deg); }
    }

    @media (max-width: 560px) {
      .card { padding: 48px 24px; border-radius: 22px; }
      .status-icon { width: 68px; height: 68px; font-size: 31px; }
      .subtitle { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-left" aria-hidden="true"></div>
  <div class="orb orb-right" aria-hidden="true"></div>

  <main class="card">
    <div class="status-icon" aria-hidden="true">✓</div>
    <p class="eyebrow">System Ready</p>
    <h1>我的第一个 Codex 项目</h1>
    <p class="subtitle">menny 非常棒！</p>
    <a class="start-button" href="#start">
      开始使用
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>
</body>
</html>
